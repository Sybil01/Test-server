<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>CELUIDO — Controlador</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --c-bg: #000;
  --c-accent: #00ff88;
  --c-accent-still: #00ccff;
  --c-accent-fast: #ffcc00;
  --c-accent-mute: #ff4466;
  --c-dim: rgba(0,255,136,0.18);
  --c-text: #e0ffe8;
  --transition: 0.06s linear;
}
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  touch-action: none;
  font-family: 'Share Tech Mono', monospace;
}
body {
  background: var(--c-bg);
  color: var(--c-text);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: background var(--transition);
}
#pantalla-inicio {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2rem;
  padding: 2rem;
  text-align: center;
}
.titulo-inicio {
  font-size: 2.2rem;
  letter-spacing: 0.3em;
  color: var(--c-accent);
  text-shadow: 0 0 20px var(--c-accent);
}
.subtitulo {
  font-size: 0.75rem;
  letter-spacing: 0.2em;
  opacity: 0.5;
  text-transform: uppercase;
}
#btn-activar {
  padding: 1rem 2rem;
  background: transparent;
  border: 1px solid var(--c-accent);
  color: var(--c-accent);
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.85rem;
  letter-spacing: 0.2em;
  cursor: pointer;
  text-transform: uppercase;
  transition: background 0.2s, box-shadow 0.2s;
  -webkit-tap-highlight-color: transparent;
}
#btn-activar:active {
  background: var(--c-dim);
  box-shadow: 0 0 20px var(--c-accent);
}
#pantalla-activa {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: 100%;
  padding: 2rem 1.5rem;
}
#pantalla-activa.visible { display: flex; }
#voz-id {
  font-size: 0.7rem;
  letter-spacing: 0.25em;
  opacity: 0.45;
  text-transform: uppercase;
}
#viz {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
}
#viz-canvas {
  width: 220px;
  height: 220px;
}
#estado-gesto {
  font-size: 1.1rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--c-accent);
  text-shadow: 0 0 10px currentColor;
  min-height: 1.4em;
}
#estado-gesto.still { color: var(--c-accent-still); }
#estado-gesto.mute { color: var(--c-accent-mute); }
#metricas {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem 1rem;
  width: 100%;
  max-width: 340px;
}
.metrica {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
}
.metrica-label {
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  opacity: 0.4;
  text-transform: uppercase;
}
.metrica-valor {
  font-size: 1rem;
  color: var(--c-accent);
  text-shadow: 0 0 8px var(--c-accent);
  transition: color 0.1s;
}
#estado-ws {
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  opacity: 0.4;
  text-transform: uppercase;
}
#estado-ws.conectado { color: var(--c-accent); opacity: 0.7; }
#estado-ws.desconectado { color: #ff4444; opacity: 0.7; }
#flash-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.06s linear;
  z-index: 999;
}
</style>
</head>
<body>
<div id="pantalla-inicio">
  <div>
    <div class="titulo-inicio">CELUIDO</div>
    <div class="subtitulo">controlador gestual</div>
  </div>
  <button id="btn-activar">Activar controlador</button>
</div>

<div id="pantalla-activa">
  <div id="voz-id">sin asignar</div>
  <div id="viz">
    <canvas id="viz-canvas" width="220" height="220"></canvas>
  </div>
  <div id="estado-gesto">—</div>
  <div id="metricas">
    <div class="metrica">
      <span class="metrica-label">magnitud</span>
      <span class="metrica-valor" id="m-dev">0.0</span>
    </div>
    <div class="metrica">
      <span class="metrica-label">velocidad</span>
      <span class="metrica-valor" id="m-vel">0.0</span>
    </div>
    <div class="metrica">
      <span class="metrica-label">vel. angular</span>
      <span class="metrica-valor" id="m-velang">0.0</span>
    </div>
    <div class="metrica">
      <span class="metrica-label">varianza</span>
      <span class="metrica-valor" id="m-var">0.0</span>
    </div>
    <div class="metrica">
      <span class="metrica-label">face up</span>
      <span class="metrica-valor" id="m-faceup">0.0s</span>
    </div>
  </div>
  <div id="estado-ws">conectando…</div>
</div>

<div id="flash-overlay"></div>

<script>
/* ============================================================
   CELUIDO — Controlador (celular.html)
   ------------------------------------------------------------
   Módulo A: CLASIFICACIÓN DE GESTOS (sección "GESTOS")
     Lee sensores crudos, aplica smoothing + hysteresis + debounce
     y produce: { state: 'STILL'|'SLOW'|null, event: 'FAST'|null,
                  faceUp: bool, faceUpElapsed: ms }
     No sabe nada de sonido ni de qué celular es cuál.

   Módulo B: TRANSPORTE (sección "RED")
     Toma la salida del módulo A y la manda por WebSocket.
     No clasifica nada, solo envía.

   Los thresholds de este archivo son constantes fijas (CFG),
   pensadas para editarse acá mismo si hace falta recalibrar.
   ============================================================ */

// ── CFG: thresholds de clasificación de gestos ─────────────────
const CFG = {
  // Suavizado (EMA) para el estado continuo SLOW/STILL
  SMOOTH_ALPHA: 0.25,

  // FAST — evento puntual: pico que sube y baja rápido
  FAST_TRIGGER: 18,        // m/s² de desviación de gravedad para iniciar el pico
  FAST_RESET: 6,           // debe bajar de acá para cerrar el pico
  FAST_MAX_DURATION: 250,  // ms máximos que puede durar el pico para contar como FAST
  FAST_DEBOUNCE: 300,      // ms mínimos entre disparos FAST consecutivos

  // STILL / SLOW — estados continuos, con hysteresis (thresholds
  // de entrada y salida distintos para no titilar en el borde)
  STILL_ENTER: 0.6,
  STILL_EXIT: 1.2,
  SLOW_EXIT: 14,           // por encima de esto ya no se considera "lento"
  STATE_MIN_DURATION: 500, // ms sostenidos para confirmar un cambio de estado
  STATE_TOLERANCE_GAP: 180,// ms de tolerancia a picos breves sin resetear el conteo

  // FACE_UP — orientación (boca arriba), independiente de FAST/SLOW/STILL
  FACEUP_AZ_THRESHOLD: 8.3,   // az (accel. incl. gravedad) por encima de esto = boca arriba
  FACEUP_TOLERANCE_GAP: 300,  // ms de tolerancia a dropouts del sensor
  FACEUP_T1: 2000,   // ms → dispara silencio corto
  FACEUP_T1_MUTE: 5000,
  FACEUP_T2: 5000,   // ms → dispara silencio largo (prioridad sobre el corto)
  FACEUP_T2_MUTE: 20000,

  SEND_RATE: 20, // Hz — frecuencia de envío del estado continuo (heartbeat)
};

// ── Módulo A: clasificación de gestos ───────────────────────────
const Gestos = (() => {
  let smoothedDev = 0;

  // telemetría continua adicional (no participa de la clasificación,
  // solo se calcula y se expone para que el maestro module el sonido)
  let devRawPrev = null;
  let velocidadSuavizada = 0;
  let varianzaSuavizada = 0;
  let anguloPrevBeta = null, anguloPrevGamma = null, anguloPrevTime = null;
  let velocidadAngularSuavizada = 0;
  let stateChangedAt = performance.now();

  // estado continuo
  let currentState = null; // 'STILL' | 'SLOW' | null
  let pendingTarget = null;
  let pendingSince = 0;
  let lastMatchTime = 0;

  // evento FAST
  let fastPeakActive = false;
  let fastPeakStart = 0;
  let lastFastEventTime = -Infinity;

  // FACE_UP
  let faceUpActive = false;
  let faceUpStart = null;
  let faceUpLastMatch = 0;
  let faceUpT1Fired = false;
  let faceUpT2Fired = false;

  // callbacks hacia afuera (los conecta el módulo de transporte)
  let onFastEvent = () => {};
  let onMuteEvent = () => {};

  function targetState(dev, current) {
    const stillThresh = current === 'STILL' ? CFG.STILL_EXIT : CFG.STILL_ENTER;
    if (dev < stillThresh) return 'STILL';
    if (dev < CFG.SLOW_EXIT) return 'SLOW';
    return null; // movimiento demasiado vigoroso y sostenido para ser "lento"
  }

  function updateContinuousState(dev, now) {
    const target = targetState(dev, currentState);
    if (target === pendingTarget) {
      lastMatchTime = now;
    } else if (now - lastMatchTime > CFG.STATE_TOLERANCE_GAP) {
      // el cambio de target persiste más que la tolerancia → lo tomamos en serio
      pendingTarget = target;
      pendingSince = now;
      lastMatchTime = now;
    }
    if (pendingTarget !== currentState && (now - pendingSince) >= CFG.STATE_MIN_DURATION) {
      currentState = pendingTarget;
      pendingSince = now;
    }
  }

  function updateFastEvent(devRaw, now) {
    if (!fastPeakActive && devRaw > CFG.FAST_TRIGGER) {
      fastPeakActive = true;
      fastPeakStart = now;
    }
    if (fastPeakActive) {
      if (devRaw < CFG.FAST_RESET) {
        const duration = now - fastPeakStart;
        fastPeakActive = false;
        if (duration <= CFG.FAST_MAX_DURATION && (now - lastFastEventTime) > CFG.FAST_DEBOUNCE) {
          lastFastEventTime = now;
          onFastEvent();
        }
      } else if (now - fastPeakStart > CFG.FAST_MAX_DURATION) {
        // se sostuvo demasiado tiempo arriba del umbral: no es un pico breve,
        // no cuenta como FAST (posible inicio de movimiento vigoroso continuo)
        fastPeakActive = false;
      }
    }
  }

  function updateFaceUp(az, now) {
    const isFaceUpRaw = az > CFG.FACEUP_AZ_THRESHOLD;
    if (isFaceUpRaw) {
      faceUpLastMatch = now;
      if (!faceUpActive) {
        faceUpActive = true;
        faceUpStart = now;
        faceUpT1Fired = false;
        faceUpT2Fired = false;
      }
    } else if (faceUpActive && (now - faceUpLastMatch) > CFG.FACEUP_TOLERANCE_GAP) {
      faceUpActive = false;
      faceUpStart = null;
    }

    if (faceUpActive) {
      const elapsed = now - faceUpStart;
      // el umbral de 5s tiene prioridad: se chequea primero
      if (!faceUpT2Fired && elapsed >= CFG.FACEUP_T2) {
        faceUpT2Fired = true;
        onMuteEvent({ duration: CFG.FACEUP_T2_MUTE, priority: true });
      } else if (!faceUpT1Fired && elapsed >= CFG.FACEUP_T1) {
        faceUpT1Fired = true;
        onMuteEvent({ duration: CFG.FACEUP_T1_MUTE, priority: false });
      }
    }
  }

  function faceUpElapsedMs() {
    if (!faceUpActive || faceUpStart === null) return 0;
    return performance.now() - faceUpStart;
  }

  return {
    onFast(cb) { onFastEvent = cb; },
    onMute(cb) { onMuteEvent = cb; },

    // se llama en cada muestra de devicemotion
    procesarMuestra(accelIncludingGravity) {
      const { x = 0, y = 0, z = 0 } = accelIncludingGravity || {};
      const now = performance.now();
      const accelMag = Math.sqrt(x * x + y * y + z * z);
      const devRaw = Math.abs(accelMag - 9.81);

      smoothedDev += CFG.SMOOTH_ALPHA * (devRaw - smoothedDev);

      // velocidad: derivada de la desviación cruda (qué tan rápido cambia el movimiento)
      if (devRawPrev !== null) {
        const delta = Math.abs(devRaw - devRawPrev);
        velocidadSuavizada += CFG.SMOOTH_ALPHA * (delta - velocidadSuavizada);
      }
      devRawPrev = devRaw;

      // varianza entre ejes: qué tan repartido/parejo está el movimiento en x,y,z
      const ax = Math.abs(x), ay = Math.abs(y), az = Math.abs(z);
      const media = (ax + ay + az) / 3;
      const varInstant = media > 0.0001
        ? (Math.abs(ax - media) + Math.abs(ay - media) + Math.abs(az - media)) / (3 * media)
        : 0;
      varianzaSuavizada += CFG.SMOOTH_ALPHA * (Math.min(varInstant, 2) - varianzaSuavizada);

      updateFastEvent(devRaw, now);
      const prevState = currentState;
      updateContinuousState(smoothedDev, now);
      if (currentState !== prevState) stateChangedAt = now;
      updateFaceUp(z, now);
    },

    // se llama en cada muestra de deviceorientation (solo para velocidad angular)
    procesarOrientacion(beta, gamma) {
      const now = performance.now();
      if (anguloPrevTime !== null) {
        const dt = Math.max((now - anguloPrevTime) / 1000, 0.001);
        const dBeta = beta - anguloPrevBeta;
        const dGamma = gamma - anguloPrevGamma;
        const vel = Math.sqrt(dBeta * dBeta + dGamma * dGamma) / dt; // grados/seg
        velocidadAngularSuavizada += CFG.SMOOTH_ALPHA * (vel - velocidadAngularSuavizada);
      }
      anguloPrevBeta = beta; anguloPrevGamma = gamma; anguloPrevTime = now;
    },

    getState() { return currentState; },
    getSmoothedDev() { return smoothedDev; },
    getVelocidad() { return velocidadSuavizada; },
    getVelocidadAngular() { return velocidadAngularSuavizada; },
    getVarianzaEjes() { return varianzaSuavizada; },
    getDuracionEstado() { return performance.now() - stateChangedAt; },
    isFaceUp() { return faceUpActive; },
    getFaceUpElapsed: faceUpElapsedMs,
  };
})();

// ── Módulo B: transporte (WebSocket) ────────────────────────────
const WS_URL = (() => {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const host = location.hostname === "localhost"
    ? "localhost:3000"
    : "servidor-de-celuido.onrender.com"; // ← reemplazar con la URL real
  return `${proto}//${host}`;
})();

let ws = null;
let myId = null;
let lastSend = 0;

function conectarWS() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: "register", role: "controlador" }));
    document.getElementById("estado-ws").textContent = "conectado";
    document.getElementById("estado-ws").className = "conectado";
  };
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.type === "assigned") {
      myId = msg.id;
      document.getElementById("voz-id").textContent = msg.id;
    }
  };
  ws.onclose = () => {
    document.getElementById("estado-ws").textContent = "desconectado — reintentando…";
    document.getElementById("estado-ws").className = "desconectado";
    setTimeout(conectarWS, 2000);
  };
  ws.onerror = () => ws.close();
}

function enviarEstado() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({
    type: "control",
    kind: "state",
    state: Gestos.getState(),
    faceUp: Gestos.isFaceUp(),
    faceUpElapsed: Math.round(Gestos.getFaceUpElapsed()),
    // telemetría continua para que el maestro module el sonido en vivo
    magnitud: +Gestos.getSmoothedDev().toFixed(3),
    velocidad: +Gestos.getVelocidad().toFixed(3),
    velocidadAngular: +Gestos.getVelocidadAngular().toFixed(2),
    varianzaEjes: +Gestos.getVarianzaEjes().toFixed(3),
    duracionEstado: Math.round(Gestos.getDuracionEstado()),
  }));
}

function enviarEventoFast() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "control", kind: "event", event: "FAST" }));
  flashEffect(0.3);
}

function enviarMute({ duration, priority }) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "control", kind: "mute", duration, priority }));
}

Gestos.onFast(enviarEventoFast);
Gestos.onMute(enviarMute);

// ── Sensores ─────────────────────────────────────────────────────
function iniciarSensores() {
  window.addEventListener("devicemotion", (e) => {
    const a = e.accelerationIncludingGravity;
    if (!a) return;
    Gestos.procesarMuestra(a);
  });
  // Solo se usa para derivar velocidad angular; no participa de la clasificación.
  window.addEventListener("deviceorientation", (e) => {
    Gestos.procesarOrientacion(e.beta || 0, e.gamma || 0);
  });
}

// ── Visualización + UI ───────────────────────────────────────────
const canvas = document.getElementById("viz-canvas");
const ctx = canvas.getContext("2d");
const CX = 110, CY = 110;
const estadoGestoEl = document.getElementById("estado-gesto");
const flashEl = document.getElementById("flash-overlay");

function flashEffect(peak) {
  flashEl.style.background = "var(--c-accent-fast)";
  flashEl.style.opacity = peak;
  setTimeout(() => { flashEl.style.opacity = 0; }, 80);
}

function drawViz() {
  requestAnimationFrame(drawViz);
  ctx.clearRect(0, 0, 220, 220);
  const now = performance.now();

  const state = Gestos.getState();
  const dev = Gestos.getSmoothedDev();
  const faceUp = Gestos.isFaceUp();
  const faceUpElapsed = Gestos.getFaceUpElapsed();

  // Texto de estado
  if (faceUp && faceUpElapsed >= CFG.FACEUP_T1) {
    estadoGestoEl.textContent = faceUpElapsed >= CFG.FACEUP_T2 ? "silencio largo" : "silencio corto";
    estadoGestoEl.className = "mute";
  } else if (state === "STILL") {
    estadoGestoEl.textContent = "STILL";
    estadoGestoEl.className = "still";
  } else if (state === "SLOW") {
    estadoGestoEl.textContent = "SLOW";
    estadoGestoEl.className = "";
  } else {
    estadoGestoEl.textContent = "—";
    estadoGestoEl.className = "";
  }

  // Anillo pulsante según dev. de gravedad (referencia visual, no funcional)
  const color = state === "STILL" ? "0,204,255" : "0,255,136";
  const pulseR = 40 + Math.min(dev, 20) * 3 + Math.sin(now * 0.004) * 4;
  const gradient = ctx.createRadialGradient(CX, CY, 0, CX, CY, pulseR);
  gradient.addColorStop(0, `rgba(${color},${0.15 + Math.min(dev / 20, 1) * 0.35})`);
  gradient.addColorStop(1, `rgba(${color},0)`);
  ctx.beginPath();
  ctx.arc(CX, CY, pulseR, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.fill();

  // Arco de progreso de FACE_UP (si está boca arriba)
  if (faceUp) {
    const target = faceUpElapsed >= CFG.FACEUP_T1 ? CFG.FACEUP_T2 : CFG.FACEUP_T1;
    const frac = Math.min(faceUpElapsed / target, 1);
    ctx.beginPath();
    ctx.arc(CX, CY, 95, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
    ctx.strokeStyle = "rgba(255,68,102,0.8)";
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  document.getElementById("m-dev").textContent = dev.toFixed(2);
  document.getElementById("m-vel").textContent = Gestos.getVelocidad().toFixed(2);
  document.getElementById("m-velang").textContent = Gestos.getVelocidadAngular().toFixed(1);
  document.getElementById("m-var").textContent = Gestos.getVarianzaEjes().toFixed(2);
  document.getElementById("m-faceup").textContent = (faceUpElapsed / 1000).toFixed(1) + "s";

  if (now - lastSend > 1000 / CFG.SEND_RATE) {
    enviarEstado();
    lastSend = now;
  }
}

// ── Activación ────────────────────────────────────────────────────
document.getElementById("btn-activar").addEventListener("click", () => {
  const activar = () => {
    document.getElementById("pantalla-inicio").style.display = "none";
    document.getElementById("pantalla-activa").classList.add("visible");
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    conectarWS();
    iniciarSensores();
    drawViz();
  };

  if (typeof DeviceMotionEvent !== "undefined" &&
      typeof DeviceMotionEvent.requestPermission === "function") {
    DeviceMotionEvent.requestPermission().then(state => {
      if (state === "granted") activar();
    }).catch(() => activar());
  } else {
    activar();
  }
});
</script>
</body>
</html>
