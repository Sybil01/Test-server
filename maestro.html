<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CELUIDO — Maestro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #050508;
  --grid: rgba(0,255,136,0.04);
  --accent: #00ff88;
  --accent2: #00ccff;
  --dim: rgba(0,255,136,0.12);
  --text: #c8ffe0;
  --danger: #ff4466;
}
html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  overflow: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}
#app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100vh;
  padding: 1.2rem 1.5rem;
  gap: 1rem;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.logo {
  font-size: 1.3rem;
  letter-spacing: 0.35em;
  color: var(--accent);
  text-shadow: 0 0 15px var(--accent);
}
.logo span {
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  opacity: 0.4;
  margin-left: 1rem;
}
#ws-status { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; }
#ws-status.ok { color: var(--accent); }
#ws-status.error { color: var(--danger); }

.ctrl-grupo { display: flex; align-items: center; gap: 0.6rem; }
.ctrl-label { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.45; }
input[type=range] {
  -webkit-appearance: none;
  width: 110px; height: 2px;
  background: var(--dim);
  outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  cursor: pointer;
}
.ctrl-val { font-size: 0.7rem; color: var(--accent); width: 3.2rem; text-align: right; }

#btn-iniciar {
  padding: 0.5rem 1.2rem;
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
  cursor: pointer;
}
#btn-iniciar:disabled { opacity: 0.3; cursor: default; }

main {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 1rem;
  overflow: hidden;
}

/* ── Panel de voces ────────────────────────────────────────── */
#panel-voces { display: flex; flex-direction: column; gap: 0.6rem; overflow-y: auto; }
.panel-titulo { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.35; }
.voz-card {
  border: 1px solid var(--dim);
  padding: 0.6rem 0.8rem;
  position: relative;
  font-size: 0.7rem;
}
.voz-card.muted { border-color: var(--danger); }
.voz-nombre { color: var(--accent); letter-spacing: 0.1em; margin-bottom: 0.3rem; }
.voz-linea { opacity: 0.6; display: flex; justify-content: space-between; }
.voz-linea span:last-child { color: var(--text); opacity: 1; }
.voz-roles { display: flex; gap: 0.4rem; margin-top: 0.4rem; }
.voz-roles button {
  flex: 1;
  background: transparent;
  border: 1px solid var(--dim);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem;
  padding: 0.25rem;
  cursor: pointer;
  letter-spacing: 0.1em;
}
.voz-roles button.activo { border-color: var(--accent); color: var(--accent); }

/* ── Panel de parámetros ──────────────────────────────────── */
#panel-config { overflow-y: auto; padding-right: 0.5rem; }
.grupo-params {
  border: 1px solid var(--dim);
  padding: 0.6rem 0.8rem;
  margin-bottom: 0.7rem;
}
.grupo-titulo {
  font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--accent2); opacity: 0.8; margin-bottom: 0.4rem;
}
.param-row {
  display: flex; align-items: center; gap: 0.6rem;
  font-size: 0.65rem; opacity: 0.7;
  padding: 0.15rem 0;
}
.param-row span:first-child { width: 110px; flex-shrink: 0; }
.param-row input[type=range] { flex: 1; width: auto; }
.param-row span:last-child { width: 3.4rem; text-align: right; color: var(--accent); opacity: 1; }

#panel-voces::-webkit-scrollbar, #panel-config::-webkit-scrollbar { width: 3px; }
#panel-voces::-webkit-scrollbar-thumb, #panel-config::-webkit-scrollbar-thumb { background: var(--dim); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">CELUIDO <span>síntesis distribuida — motores por gesto</span></div>
    <div class="ctrl-grupo">
      <button id="btn-iniciar">Iniciar audio</button>
      <span class="ctrl-label">vol. maestro</span>
      <input type="range" id="ctrl-master" min="0" max="1" value="0.7" step="0.01">
      <span class="ctrl-val" id="val-master">0.70</span>
      <div id="ws-status">desconectado</div>
    </div>
  </header>

  <main>
    <div id="panel-voces">
      <div class="panel-titulo">voces conectadas</div>
      <div id="lista-voces"></div>
    </div>
    <div id="panel-config"></div>
  </main>
</div>

<script>
/* ============================================================
   CELUIDO — Maestro (maestro.html)
   Recibe { kind: 'state'|'event'|'mute', ... } por celular y
   mapea a motores de síntesis según el ROL asignado a esa voz
   (c1 / c2). La clasificación de gestos NO vive acá — solo el
   mapeo gesto → sonido.
   ============================================================ */

// ── PARAMS: todo lo que el panel de la derecha permite ajustar ──
const PARAMS = {
  c1: {
    perc:  { attack: 0.002, decay: 0.07, filterMin: 800, filterMax: 3000 },
    gran:  { grainMin: 0.01, grainMax: 0.12, densityMin: 5, densityMax: 40,
             filterMin: 300, filterMax: 6000, irregularidad: 0.7 },
    still: { freq: 164.81, attack: 0.6, vibratoRateMin: 4, vibratoRateMax: 6.5,
             vibratoDepth: 6, microAmp: 0.04 },
  },
  c2: {
    fast:   { fadeIn: 0.015, fadeOut: 0.05, volumen: 0.4 },
    glitch: { densityMin: 8, densityMax: 35, probCorte: 0.3,
              burstMin: 0.02, burstMax: 0.25, distorsion: 40 },
    still:  { freqA: 110.00, freqC: 130.81, durMin: 1.5, durMax: 6,
              vibratoRateMin: 4, vibratoRateMax: 6.5, vibratoDepth: 6, microAmp: 0.04 },
  },
};

function randRange(a, b) { return a + Math.random() * (b - a); }
function setDeep(obj, path, value) {
  let o = obj;
  for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
  o[path[path.length - 1]] = value;
}

// ── Utilidades de audio ──────────────────────────────────────────
function crearBufferRuido(ctx, segundos = 2) {
  const buffer = ctx.createBuffer(1, ctx.sampleRate * segundos, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  return buffer;
}
function crearCurvaDistorsion(cantidad = 40) {
  const n = 44100;
  const curve = new Float32Array(n);
  const deg = Math.PI / 180;
  for (let i = 0; i < n; i++) {
    const x = (i * 2) / n - 1;
    curve[i] = ((3 + cantidad) * x * 20 * deg) / (Math.PI + cantidad * Math.abs(x));
  }
  return curve;
}

// ── Motor: percusión (Celular 1 / FAST) ──────────────────────────
function crearMotorPercusion(ctx, out, ruido) {
  return {
    trigger() {
      const p = PARAMS.c1.perc;
      const t = ctx.currentTime;
      const src = ctx.createBufferSource();
      src.buffer = ruido;
      const filtro = ctx.createBiquadFilter();
      filtro.type = 'bandpass';
      filtro.frequency.value = randRange(p.filterMin, p.filterMax);
      filtro.Q.value = randRange(2, 8);
      const env = ctx.createGain();
      env.gain.setValueAtTime(0, t);
      env.gain.linearRampToValueAtTime(1, t + Math.max(p.attack, 0.001));
      env.gain.exponentialRampToValueAtTime(0.0001, t + p.attack + Math.max(p.decay, 0.01));
      src.connect(filtro); filtro.connect(env); env.connect(out);
      src.start(t);
      src.stop(t + p.attack + p.decay + 0.05);
    },
  };
}

// ── Motor: granular (Celular 1 / SLOW — ref. Vaggione) ───────────
function crearMotorGranular(ctx, out, ruido) {
  let activo = false, timeoutId = null;
  function programarGrano() {
    if (!activo) return;
    const p = PARAMS.c1.gran;
    const t = ctx.currentTime;
    const dur = randRange(p.grainMin, p.grainMax);
    const src = ctx.createBufferSource();
    src.buffer = ruido;
    src.playbackRate.value = randRange(0.5, 2.5) * (Math.random() < 0.5 ? 1 : -1);
    const offset = Math.max(Math.random() * (ruido.duration - dur - 0.02), 0);
    const filtro = ctx.createBiquadFilter();
    filtro.type = Math.random() < 0.5 ? 'bandpass' : 'highpass';
    filtro.frequency.value = randRange(p.filterMin, p.filterMax);
    filtro.Q.value = randRange(0.5, 6);
    const env = ctx.createGain();
    const amp = randRange(0.15, 0.9) * (1 - p.irregularidad * 0.5 + Math.random() * p.irregularidad);
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(Math.max(amp, 0), t + dur * 0.3);
    env.gain.linearRampToValueAtTime(0, t + dur);
    src.connect(filtro); filtro.connect(env); env.connect(out);
    src.start(t, offset, dur);
    const densidad = randRange(p.densityMin, p.densityMax);
    const intervalo = (1000 / densidad) * randRange(1 - p.irregularidad * 0.6, 1 + p.irregularidad * 0.6);
    timeoutId = setTimeout(programarGrano, Math.max(intervalo, 5));
  }
  return {
    start() { if (activo) return; activo = true; programarGrano(); },
    stop() { activo = false; clearTimeout(timeoutId); },
  };
}

// ── Motor: tono sostenido con vibrato irregular (STILL, C1 y C2) ─
function crearMotorTono(ctx, out) {
  let nodos = null;
  return {
    start(freq, paramsGetter) {
      if (nodos) return;
      const p = paramsGetter();
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      const filtro = ctx.createBiquadFilter();
      filtro.type = 'lowpass';
      filtro.frequency.value = freq * 6;
      filtro.Q.value = 1;
      const gainPrincipal = ctx.createGain();
      gainPrincipal.gain.setValueAtTime(0, t);
      gainPrincipal.gain.linearRampToValueAtTime(0.5, t + Math.max(p.attack || 0.3, 0.01));

      // vibrato: LFO rápido cuya velocidad la modula un LFO lento → nunca es perfectamente regular
      const vibratoLFO = ctx.createOscillator();
      vibratoLFO.type = 'sine';
      vibratoLFO.frequency.value = randRange(p.vibratoRateMin, p.vibratoRateMax);
      const vibratoLFOLento = ctx.createOscillator();
      vibratoLFOLento.type = 'sine';
      vibratoLFOLento.frequency.value = randRange(0.04, 0.15);
      const modRate = ctx.createGain();
      modRate.gain.value = Math.max((p.vibratoRateMax - p.vibratoRateMin) / 2, 0.01);
      vibratoLFOLento.connect(modRate); modRate.connect(vibratoLFO.frequency);
      const gainVibrato = ctx.createGain();
      gainVibrato.gain.value = p.vibratoDepth;
      vibratoLFO.connect(gainVibrato); gainVibrato.connect(osc.frequency);

      // micro variaciones de amplitud (trémolo sutil)
      const microLFO = ctx.createOscillator();
      microLFO.type = 'sine';
      microLFO.frequency.value = randRange(0.3, 0.9);
      const microGain = ctx.createGain();
      microGain.gain.value = p.microAmp;
      microLFO.connect(microGain); microGain.connect(gainPrincipal.gain);

      osc.connect(filtro); filtro.connect(gainPrincipal); gainPrincipal.connect(out);
      osc.start(t); vibratoLFO.start(t); vibratoLFOLento.start(t); microLFO.start(t);
      nodos = { osc, filtro, gainPrincipal, vibratoLFO, vibratoLFOLento, microLFO };
    },
    setFreq(freq) {
      if (!nodos) return;
      const t = ctx.currentTime;
      nodos.osc.frequency.setTargetAtTime(freq, t, 0.15);
      nodos.filtro.frequency.setTargetAtTime(freq * 6, t, 0.15);
    },
    stop() {
      if (!nodos) return;
      const t = ctx.currentTime;
      nodos.gainPrincipal.gain.setTargetAtTime(0, t, 0.1);
      const n = nodos;
      setTimeout(() => {
        [n.osc, n.vibratoLFO, n.vibratoLFOLento, n.microLFO].forEach(o => { try { o.stop(); } catch (e) {} });
      }, 400);
      nodos = null;
    },
  };
}

// ── Motor: toggle de ruido blanco (Celular 2 / FAST) ─────────────
function crearMotorToggleRuido(ctx, out, ruido) {
  let activo = false, src = null, gainNode = null;
  return {
    toggle() {
      const p = PARAMS.c2.fast;
      const t = ctx.currentTime;
      activo = !activo;
      if (activo) {
        src = ctx.createBufferSource();
        src.buffer = ruido; src.loop = true;
        gainNode = ctx.createGain();
        gainNode.gain.setValueAtTime(0, t);
        gainNode.gain.linearRampToValueAtTime(p.volumen, t + Math.max(p.fadeIn, 0.001));
        src.connect(gainNode); gainNode.connect(out);
        src.start(t);
      } else if (gainNode) {
        gainNode.gain.setValueAtTime(gainNode.gain.value, t);
        gainNode.gain.linearRampToValueAtTime(0, t + Math.max(p.fadeOut, 0.001));
        const s = src;
        setTimeout(() => { try { s.stop(); } catch (e) {} }, p.fadeOut * 1000 + 50);
      }
    },
  };
}

// ── Motor: glitch agresivo (Celular 2 / SLOW — ref. AV3RY) ───────
function crearMotorGlitch(ctx, out, ruido, curva) {
  let activo = false, timeoutId = null;
  function programarEvento() {
    if (!activo) return;
    const p = PARAMS.c2.glitch;
    const t = ctx.currentTime;
    const dur = randRange(p.burstMin, p.burstMax);
    const src = ctx.createBufferSource();
    src.buffer = ruido;
    src.playbackRate.value = randRange(0.5, 4);
    const offset = Math.max(Math.random() * (ruido.duration - dur - 0.02), 0);
    const waveshaper = ctx.createWaveShaper();
    waveshaper.curve = curva;
    waveshaper.oversample = '2x';
    const env = ctx.createGain();
    if (Math.random() < p.probCorte) {
      env.gain.setValueAtTime(randRange(0.3, 1), t);
      env.gain.setValueAtTime(0, t + dur * randRange(0.3, 0.7));
    } else {
      env.gain.setValueAtTime(0, t);
      env.gain.linearRampToValueAtTime(randRange(0.3, 1), t + 0.002);
      env.gain.linearRampToValueAtTime(0, t + dur);
    }
    src.connect(waveshaper); waveshaper.connect(env); env.connect(out);
    src.start(t, offset, dur);
    const densidad = randRange(p.densityMin, p.densityMax);
    const intervalo = (1000 / densidad) * randRange(0.3, 1.7);
    timeoutId = setTimeout(programarEvento, Math.max(intervalo, 5));
  }
  return {
    start() { if (activo) return; activo = true; programarEvento(); },
    stop() { activo = false; clearTimeout(timeoutId); },
  };
}

// ── Motor: alternancia La2/Do3 (Celular 2 / STILL) ───────────────
function crearMotorAlternancia(ctx, out, motorTono) {
  let activo = false, timeoutId = null, freqActual;
  function programarCambio() {
    if (!activo) return;
    const p = PARAMS.c2.still;
    freqActual = freqActual === p.freqA ? p.freqC : p.freqA;
    motorTono.setFreq(freqActual);
    const dur = randRange(p.durMin, p.durMax) * 1000;
    timeoutId = setTimeout(programarCambio, dur);
  }
  return {
    start() {
      if (activo) return;
      activo = true;
      const p = PARAMS.c2.still;
      freqActual = p.freqA;
      motorTono.start(freqActual, () => p);
      programarCambio();
    },
    stop() { activo = false; clearTimeout(timeoutId); motorTono.stop(); },
  };
}

// ── VoiceAudio: liga rol + estado a los motores, y aplica mute ───
class VoiceAudio {
  constructor(ctx, master, ruido, curva) {
    this.ctx = ctx;
    this.gainMute = ctx.createGain();
    this.gainMute.gain.value = 1;
    this.gainMute.connect(master);
    this.role = null;
    this.modo = null;
    this.muteUntil = 0;
    this.muteTimeoutId = null;

    this.percusion = crearMotorPercusion(ctx, this.gainMute, ruido);
    this.granular = crearMotorGranular(ctx, this.gainMute, ruido);
    this.tonoC1 = crearMotorTono(ctx, this.gainMute);
    this.tonoC2 = crearMotorTono(ctx, this.gainMute);
    this.toggleRuido = crearMotorToggleRuido(ctx, this.gainMute, ruido);
    this.glitch = crearMotorGlitch(ctx, this.gainMute, ruido, curva);
    this.alternancia = crearMotorAlternancia(ctx, this.gainMute, this.tonoC2);
  }
  setRole(role) {
    if (this.role === role) return;
    this._detenerModo();
    this.role = role;
  }
  _detenerModo() {
    if (this.modo === 'SLOW') {
      if (this.role === 'c1') this.granular.stop();
      if (this.role === 'c2') this.glitch.stop();
    } else if (this.modo === 'STILL') {
      if (this.role === 'c1') this.tonoC1.stop();
      if (this.role === 'c2') this.alternancia.stop();
    }
    this.modo = null;
  }
  setEstado(state) {
    if (!this.role || state === this.modo) return;
    this._detenerModo();
    this.modo = state;
    if (state === 'SLOW') {
      if (this.role === 'c1') this.granular.start();
      if (this.role === 'c2') this.glitch.start();
    } else if (state === 'STILL') {
      if (this.role === 'c1') this.tonoC1.start(PARAMS.c1.still.freq, () => PARAMS.c1.still);
      if (this.role === 'c2') this.alternancia.start();
    }
  }
  triggerFast() {
    if (this.role === 'c1') this.percusion.trigger();
    if (this.role === 'c2') this.toggleRuido.toggle();
  }
  aplicarMute({ duration }) {
    const t = this.ctx.currentTime;
    const fin = performance.now() + duration;
    this.muteUntil = Math.max(this.muteUntil, fin);
    this.gainMute.gain.cancelScheduledValues(t);
    this.gainMute.gain.setTargetAtTime(0, t, 0.01);
    clearTimeout(this.muteTimeoutId);
    const restante = Math.max(this.muteUntil - performance.now(), 0);
    this.muteTimeoutId = setTimeout(() => {
      const t2 = this.ctx.currentTime;
      this.gainMute.gain.setTargetAtTime(1, t2, 0.05);
    }, restante);
  }
  desconectar() {
    this._detenerModo();
    clearTimeout(this.muteTimeoutId);
    this.gainMute.disconnect();
  }
}

// ── Estado global: audio, voces, roles ───────────────────────────
let audioCtx = null, masterGainNode = null, ruidoBuffer = null, curvaDistorsion = null;
let masterVol = 0.7;
const voces = new Map(); // id → { audio: VoiceAudio|null, role, state, faceUp, faceUpElapsed }
const roles = { c1: null, c2: null };

function asignarRolAutomatico(id) {
  if (!roles.c1) { roles.c1 = id; return 'c1'; }
  if (!roles.c2) { roles.c2 = id; return 'c2'; }
  return null;
}
function reasignarManual(id, rolNuevo) {
  const prevOwner = roles[rolNuevo];
  if (prevOwner && prevOwner !== id && voces.has(prevOwner)) {
    voces.get(prevOwner).role = null;
    if (voces.get(prevOwner).audio) voces.get(prevOwner).audio.setRole(null);
  }
  Object.keys(roles).forEach(r => { if (roles[r] === id) roles[r] = null; });
  roles[rolNuevo] = id;
  const v = voces.get(id);
  if (v) {
    v.role = rolNuevo;
    if (v.audio) v.audio.setRole(rolNuevo);
  }
  renderVoces();
}

function crearVozInfo(id) {
  if (voces.has(id)) return;
  const rol = asignarRolAutomatico(id);
  const info = { audio: null, role: rol, state: null, faceUp: false, faceUpElapsed: 0 };
  voces.set(id, info);
  if (audioCtx) activarAudioDeVoz(id);
}
function activarAudioDeVoz(id) {
  const info = voces.get(id);
  if (!info || info.audio) return;
  info.audio = new VoiceAudio(audioCtx, masterGainNode, ruidoBuffer, curvaDistorsion);
  info.audio.setRole(info.role);
}
function eliminarVoz(id) {
  const info = voces.get(id);
  if (!info) return;
  if (info.audio) info.audio.desconectar();
  Object.keys(roles).forEach(r => { if (roles[r] === id) roles[r] = null; });
  voces.delete(id);
}

// ── WebSocket ─────────────────────────────────────────────────────
const WS_URL = (() => {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const host = location.hostname === "localhost" ? "localhost:3000" : "servidor-de-celuido.onrender.com";
  return `${proto}//${host}`;
})();
let ws;
function conectarWS() {
  ws = new WebSocket(WS_URL);
  const statusEl = document.getElementById("ws-status");
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: "register", role: "maestro" }));
    statusEl.textContent = "conectado"; statusEl.className = "ok";
  };
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.type === "state") {
      msg.voices.forEach(id => crearVozInfo(id));
      renderVoces();
    } else if (msg.type === "connect") {
      crearVozInfo(msg.id);
      renderVoces();
    } else if (msg.type === "disconnect") {
      eliminarVoz(msg.id);
      renderVoces();
    } else if (msg.type === "control") {
      manejarControl(msg);
    }
  };
  ws.onclose = () => {
    statusEl.textContent = "desconectado — reintentando…"; statusEl.className = "error";
    setTimeout(conectarWS, 2000);
  };
  ws.onerror = () => ws.close();
}
function manejarControl(msg) {
  const info = voces.get(msg.id);
  if (!info) return;
  if (msg.kind === "state") {
    info.state = msg.state;
    info.faceUp = msg.faceUp;
    info.faceUpElapsed = msg.faceUpElapsed;
    if (info.audio) info.audio.setEstado(msg.state);
  } else if (msg.kind === "event" && msg.event === "FAST") {
    if (info.audio) info.audio.triggerFast();
  } else if (msg.kind === "mute") {
    if (info.audio) info.audio.aplicarMute(msg);
  }
  actualizarCard(msg.id);
}

// ── UI: lista de voces ────────────────────────────────────────────
function renderVoces() {
  const cont = document.getElementById("lista-voces");
  cont.innerHTML = "";
  if (voces.size === 0) {
    cont.innerHTML = `<div style="font-size:0.65rem;opacity:0.3">sin controladores</div>`;
    return;
  }
  voces.forEach((info, id) => {
    const card = document.createElement("div");
    card.className = "voz-card";
    card.id = `card-${id}`;
    card.innerHTML = `
      <div class="voz-nombre">${id}</div>
      <div class="voz-linea">estado <span id="${id}-estado">—</span></div>
      <div class="voz-linea">face up <span id="${id}-faceup">—</span></div>
      <div class="voz-roles">
        <button data-id="${id}" data-rol="c1" class="${info.role === 'c1' ? 'activo' : ''}">Celular 1</button>
        <button data-id="${id}" data-rol="c2" class="${info.role === 'c2' ? 'activo' : ''}">Celular 2</button>
      </div>`;
    cont.appendChild(card);
  });
  cont.querySelectorAll("button[data-rol]").forEach(btn => {
    btn.addEventListener("click", () => reasignarManual(btn.dataset.id, btn.dataset.rol));
  });
}
function actualizarCard(id) {
  const info = voces.get(id);
  if (!info) return;
  const setTxt = (sel, val) => { const el = document.getElementById(sel); if (el) el.textContent = val; };
  setTxt(`${id}-estado`, info.state || "—");
  setTxt(`${id}-faceup`, info.faceUp ? (info.faceUpElapsed / 1000).toFixed(1) + "s" : "—");
  const card = document.getElementById(`card-${id}`);
  if (card) card.classList.toggle("muted", info.audio && info.audio.muteUntil > performance.now());
}
setInterval(() => voces.forEach((_, id) => actualizarCard(id)), 300);

// ── UI: panel de parámetros (generado desde PARAMS) ──────────────
function inferirRango(key, val) {
  if (/prob|irregularidad|fadeIn|fadeOut|microAmp|volumen/i.test(key)) return { min: 0, max: 1, step: 0.01 };
  if (/freq/i.test(key)) return { min: 20, max: 1000, step: 0.01 };
  if (/filter/i.test(key)) return { min: 20, max: 8000, step: 1 };
  if (/density/i.test(key)) return { min: 1, max: 60, step: 1 };
  if (/vibratoRate/i.test(key)) return { min: 0.5, max: 12, step: 0.1 };
  if (/vibratoDepth/i.test(key)) return { min: 0, max: 30, step: 0.5 };
  if (/dur|attack|decay|burst|grain/i.test(key)) return { min: 0, max: Math.max(val * 4, 0.5), step: 0.001 };
  if (/distorsion/i.test(key)) return { min: 0, max: 100, step: 1 };
  return { min: 0, max: Math.max(val * 3, 1), step: val < 1 ? 0.01 : 1 };
}
function crearPanelParams(container, obj, path = []) {
  Object.entries(obj).forEach(([key, val]) => {
    if (typeof val === "object") {
      const grupo = document.createElement("div");
      grupo.className = "grupo-params";
      const titulo = document.createElement("div");
      titulo.className = "grupo-titulo";
      titulo.textContent = path.concat(key).join(" / ");
      grupo.appendChild(titulo);
      container.appendChild(grupo);
      crearPanelParams(grupo, val, path.concat(key));
    } else if (typeof val === "number") {
      const { min, max, step } = inferirRango(key, val);
      const row = document.createElement("label");
      row.className = "param-row";
      const label = document.createElement("span"); label.textContent = key;
      const input = document.createElement("input");
      input.type = "range"; input.min = min; input.max = max; input.step = step; input.value = val;
      const valSpan = document.createElement("span"); valSpan.textContent = val;
      input.addEventListener("input", (e) => {
        const v = parseFloat(e.target.value);
        setDeep(PARAMS, path.concat(key), v);
        valSpan.textContent = v;
      });
      row.append(label, input, valSpan);
      container.appendChild(row);
    }
  });
}

// ── Audio context / controles maestros ───────────────────────────
document.getElementById("btn-iniciar").addEventListener("click", () => {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGainNode = audioCtx.createGain();
  masterGainNode.gain.value = masterVol;
  masterGainNode.connect(audioCtx.destination);
  ruidoBuffer = crearBufferRuido(audioCtx, 2);
  curvaDistorsion = crearCurvaDistorsion(PARAMS.c2.glitch.distorsion);
  document.getElementById("btn-iniciar").disabled = true;
  document.getElementById("btn-iniciar").textContent = "audio activo";
  voces.forEach((_, id) => activarAudioDeVoz(id));
});
document.getElementById("ctrl-master").addEventListener("input", (e) => {
  masterVol = parseFloat(e.target.value);
  document.getElementById("val-master").textContent = masterVol.toFixed(2);
  if (masterGainNode) masterGainNode.gain.setTargetAtTime(masterVol, audioCtx.currentTime, 0.05);
});

// ── Init ──────────────────────────────────────────────────────────
crearPanelParams(document.getElementById("panel-config"), PARAMS);
conectarWS();
renderVoces();
</script>
